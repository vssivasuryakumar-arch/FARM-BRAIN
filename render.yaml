# FARM BRAIN early hosted deployment. The web tier is Free for preview only;
# PostgreSQL is a paid persistent database. Upgrade the web service before launch.
services:
  - type: web
    name: farm-brain-web
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 'farm_brain:create_app()'
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: farm-brain-db
          property: connectionString
      - key: COOKIE_SECURE
        value: "true"
      - key: FLASK_DEBUG
        value: "false"
      - key: ADMIN_EMAIL
        sync: false
      - key: OGD_API_KEY
        sync: false
      - key: OGD_MANDI_RESOURCE_ID
        sync: false

databases:
  - name: farm-brain-db
    region: singapore
    plan: 0.1c-256mb
    databaseName: farm_brain
    user: farm_brain
